<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازیابی رمز — AuroraList</title>
<style>
  body { font-family: Tahoma, system-ui, sans-serif; background: #0d1117; color: #e6edf3;
         display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px;
          padding: 32px 28px; max-width: 420px; width: calc(100% - 48px); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { line-height: 1.9; color: #9fb0c1; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0;
          border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 15px; }
  button { width: 100%; padding: 12px; margin-top: 10px; border: 0; border-radius: 10px;
           background: #7c5cd6; color: #fff; font-size: 16px; cursor: pointer; }
  button:disabled { opacity: .5; }
  .err { color: #f85149; font-size: 13px; min-height: 20px; }
  .ok { color: #3fb950; font-size: 40px; }
</style>
</head>
<body>
<div class="card">
  <div id="formBox">
    <h1>رمز جدیدت رو بذار</h1>
    <p>برای حساب AuroraList یه رمز تازه انتخاب کن (حداقل ۸ کاراکتر).</p>
    <input type="password" id="pw1" placeholder="رمز جدید" autocomplete="new-password">
    <input type="password" id="pw2" placeholder="تکرار رمز جدید" autocomplete="new-password">
    <div class="err" id="err"></div>
    <button id="go">عوض کردن رمز</button>
  </div>
  <div id="doneBox" style="display:none">
    <div class="ok">✅</div>
    <h1>رمزت عوض شد</h1>
    <p>حالا برگرد به اپ AuroraList و با رمز جدیدت وارد شو.</p>
  </div>
</div>
<script>
  const PROJECT = '6ad89baf00083a09a7cb';
  const API = 'https://nyc.cloud.appwrite.io/v1';
  const params = new URLSearchParams(location.search);
  const userId = params.get('userId');
  const secret = params.get('secret');
  history.replaceState(null, '', location.pathname);
  const err = document.getElementById('err');
  const go = document.getElementById('go');
  if (!userId || !secret) {
    err.textContent = 'این لینک ناقصه. از تو اپ دوباره درخواست بازیابی رمز بده.';
    go.disabled = true;
  }
  go.addEventListener('click', async () => {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    err.textContent = '';
    if (pw1.length < 8) { err.textContent = 'رمز باید حداقل ۸ کاراکتر باشه.'; return; }
    if (pw1 !== pw2) { err.textContent = 'دو تا رمز مثل هم نیستن.'; return; }
    go.disabled = true; go.textContent = 'در حال انجام…';
    try {
      const r = await fetch(API + '/account/recovery', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Appwrite-Project': PROJECT },
        body: JSON.stringify({ userId: userId, secret: secret, password: pw1 })
      });
      if (r.ok) {
        document.getElementById('formBox').style.display = 'none';
        document.getElementById('doneBox').style.display = 'block';
      } else {
        const data = await r.json().catch(() => ({}));
        err.textContent = data.type === 'user_invalid_token'
          ? 'این لینک منقضی شده یا قبلاً استفاده شده. از تو اپ دوباره درخواست بازیابی بده.'
          : 'یه مشکلی پیش اومد: ' + (data.message || ('HTTP ' + r.status));
        go.disabled = false; go.textContent = 'عوض کردن رمز';
      }
    } catch (e) {
      err.textContent = 'به سرور نرسیدم؛ اینترنتت رو چک کن و دوباره بزن.';
      go.disabled = false; go.textContent = 'عوض کردن رمز';
    }
  });
</script>
</body>
</html>
